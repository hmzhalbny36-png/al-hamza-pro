name: Build APK Direct

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-pip build-core git zlib1g-dev zlib1g:i386 libncurses5:i386 libstdc++6:i386 libz1:i386 \
          openjdk-17-jdk ant mercurial patch sed wget curl

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install --user cython==0.29.36
        pip install --user buildozer

    - name: Run Buildozer Build
      run: |
        export PATH=$PATH:~/.local/bin
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Al-Hamza-Pro-App
        path: bin/*.apk
