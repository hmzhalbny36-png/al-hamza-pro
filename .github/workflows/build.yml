name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60   # مهلة أطول

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: 9477386

    - name: Install specific build-tools and platforms
      run: |
        yes | sdkmanager --licenses
        sdkmanager "build-tools;33.0.0"
        sdkmanager "platforms;android-33"
        sdkmanager "platform-tools"

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
          libjpeg-dev libpng-dev libfreetype6-dev
        pip install --upgrade pip
        pip install buildozer
        pip install cython==0.29.37

    - name: Build with Buildozer
      run: |
        # إجبار Buildozer على استخدام Python 3.10
        export PATH="/opt/hostedtoolcache/Python/3.10.21/x64/bin:$PATH"
        python --version  # تأكيد الإصدار
        buildozer android debug
      env:
        ANDROID_HOME: ${{ env.ANDROID_HOME }}
        GRADLE_OPTS: "-Xmx1024m -Xms256m"
        # منع Buildozer من إنشاء بيئة افتراضية بإصدار مختلف
        PIP_REQUIRE_VIRTUALENV: "false"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MyApp-APK
        path: bin/*.apk
