name: بناء تطبيق أندرويد

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
    - name: 1. سحب الكود
      uses: actions/checkout@v4

    - name: 2. إعداد بايثون
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. تثبيت متطلبات النظام
      run: |
        sudo apt update
        sudo apt install -y \
          git zip unzip openjdk-17-jdk \
          autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev \
          cmake libffi-dev libssl-dev
        sudo update-alternatives --install /usr/bin/java java /usr/lib/jvm/java-17-openjdk-amd64/bin/java 1
        sudo update-alternatives --set java /usr/lib/jvm/java-17-openjdk-amd64/bin/java

    - name: 4. تثبيت Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer cython

    - name: 5. تحميل وتثبيت أدوات أندرويد وقبول التراخيص
      run: |
        export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
        mkdir -p "$ANDROID_HOME"
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
        unzip -q /tmp/cmdline-tools.zip -d /tmp/
        mkdir -p "$ANDROID_HOME/cmdline-tools"
        mv /tmp/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;37.0.0" "platforms;android-33"

    - name: 6. إنشاء ملف buildozer.spec إذا كان مفقوداً
      run: |
        if [ ! -f "buildozer.spec" ]; then
          echo "⚠️ ملف buildozer.spec غير موجود، سيتم إنشاؤه..."
          printf '[app]\ntitle = تطبيقي\npackage.name = myapp\npackage.domain = org.test\n\n[buildozer]\nandroid.accept_sdk_license = True\nandroid.sdk_build_tools = 37.0.0\nandroid.ndk = 25c\nandroid.minapi = 21\nandroid.target_sdk = 33\n' > buildozer.spec
        fi

    - name: 7. بناء ملف APK
      run: |
        export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
        buildozer android debug

    - name: 8. رفع ملف APK
      uses: actions/upload-artifact@v4
      with:
        name: التطبيق-النهائي
        path: bin/*.apk
