name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. سحب الكود
      uses: actions/checkout@v4

    - name: 2. إعداد Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. تثبيت متطلبات النظام (مع إعادة المحاولة)
      run: |
        # محاولة تحديث المستودعات 3 مرات عند الفشل
        for i in {1..3}; do
          echo "محاولة apt update رقم $i"
          sudo apt update && break || sleep 10
        done
        # تثبيت الحزم مع تجاهل أي خطأ فردي (لأن بعضها قد يكون مثبتاً)
        sudo apt install -y \
          git zip unzip openjdk-17-jdk \
          autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev libtinfo5 \
          cmake libffi-dev libssl-dev || true
        # تعيين Java 17 كافتراضي
        sudo update-alternatives --set java /usr/lib/jvm/java-17-openjdk-amd64/bin/java

    - name: 4. تثبيت Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer cython

    - name: 5. إعداد Android SDK يدوياً (قبول التراخيص وتثبيت Build-Tools)
      run: |
        export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
        mkdir -p "$ANDROID_HOME"
        # تحميل أدوات سطر الأوامر من Google
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
        unzip -q /tmp/cmdline-tools.zip -d /tmp/
        mkdir -p "$ANDROID_HOME/cmdline-tools"
        mv /tmp/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
        # إضافة إلى المسار
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        # قبول التراخيص تلقائياً (هذا يحل مشكلتك الأصلية)
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1
        # تثبيت Build-Tools 37 ومنصة Android 33
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;37.0.0" "platforms;android-33"

    - name: 6. بناء ملف APK
      run: |
        export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
        buildozer android debug

    - name: 7. رفع ملف APK الناتج
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: bin/*.apk
