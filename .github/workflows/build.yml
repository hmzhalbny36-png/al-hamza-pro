name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. سحب الكود
      uses: actions/checkout@v4

    - name: 2. إعداد Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. تثبيت متطلبات النظام (لـ Buildozer)
      run: |
        sudo apt update
        sudo apt install -y \
          git zip unzip openjdk-17-jdk \
          autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev libtinfo5 \
          cmake libffi-dev libssl-dev

    # ===== هذه هي الخطوة السحرية البديلة (تحل مشكلتك نهائياً) =====
    - name: 4. إعداد Android SDK وقبول التراخيص باستخدام أداة رسمية
      uses: android-actions/setup-android@v3
      with:
        # تثبيت الإصدار 37 الذي يطلبه مشروعك
        packages: 'build-tools;37.0.0'
    # ============================================================

    - name: 5. تثبيت Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer cython

    - name: 6. بناء ملف APK
      run: |
        # تعيين مسار SDK حتى يراه Buildozer
        export ANDROID_HOME=$ANDROID_HOME
        buildozer android debug

    - name: 7. رفع ملف APK الناتج
      uses: actions/upload-artifact@v4
      with:
        name: my-app-debug
        path: bin/*.apk
