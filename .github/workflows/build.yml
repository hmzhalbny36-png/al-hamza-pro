name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:    # تتيح لك التشغيل اليدوي من صفحة الأكشنز

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. سحب الكود من المستودع
      uses: actions/checkout@v4

    - name: 2. إعداد Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. تثبيت متطلبات النظام (لـ Buildozer)
      run: |
        sudo apt update
        sudo apt install -y \
          git zip unzip openjdk-17-jdk \
          autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev libtinfo5 \
          cmake libffi-dev libssl-dev

    - name: 4. تثبيت Buildozer و Cython
      run: |
        pip install --upgrade pip
        pip install buildozer cython

    # ===== الخطوة السحرية التي تحل مشكلتك =====
    - name: 5. تثبيت Android SDK وقبول التراخيص تلقائياً
      run: |
        # تحميل سطر الأوامر الخاص بـ SDK (command-line tools)
        wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip commandlinetools-linux-*.zip
        mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools
        mv cmdline-tools ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest
        
        # تعيين المسار في البيئة
        echo "$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk" >> $GITHUB_ENV
        
        # قبول جميع التراخيص بدون تدخل (الحل النهائي)
        yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1
        
        # تثبيت Build-Tools 37 المطلوب بشكل صريح
        ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager "build-tools;37.0.0"
    # ==========================================

    - name: 6. بناء ملف APK باستخدام Buildozer
      run: |
        # تأكد من وجود ملف buildozer.spec في جذر المشروع
        buildozer android debug

    - name: 7. رفع ملف APK الناتج (تحميله)
      uses: actions/upload-artifact@v4
      with:
        name: my-app-debug
        path: bin/*.apk
